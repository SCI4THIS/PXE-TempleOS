worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log /dev/stderr;
    error_log /dev/stderr;
    sendfile on;
    keepalive_timeout 65;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=apkcache:10m max_size=1g inactive=30d use_temp_path=off;

    server {
        listen 80;
        root /var/www/htdocs;

	# boot.ipxe is generated by start.sh outside the container-owned web root.
	#Serving the bind-mounted file directly makes menu changes live immediately.
	location /x86-efi/boot.ipxe {
            alias /rpi3b-pxe-boot.ipxe;
	}

        # TempleOS is downloaded and completion-checked by start.sh.
        location = /templeos.org/Downloads/TempleOS.ISO {
            alias /var/www/htdocs/media/templeos/TempleOS.ISO;
        }

        # Managed RO media, including Omarchy kernel/initramfs.
        location /media/ {
            try_files $uri =404;
        }

        location /dl-cdn.alpinelinux.org/ {
            rewrite ^/dl-cdn.alpinelinux.org/(.*)$ /$1 break;
            try_files $uri @mirror;
        }

        location @mirror {
            proxy_pass https://dl-cdn.alpinelinux.org;
            proxy_cache apkcache;
            proxy_cache_valid 200 302 30d;
            proxy_cache_valid 404 1m;
            add_header X-Cache-Status $upstream_cache_status;
        }
    }
}
