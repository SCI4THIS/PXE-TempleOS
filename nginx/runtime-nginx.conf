worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log /dev/stderr;
    error_log /dev/stderr;
    sendfile on;
    keepalive_timeout 65;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=apkcache:10m max_size=1g inactive=30d use_temp_path=off;

    server {
        listen 80;
        root /var/www/htdocs;

        # Generated by start.sh in the host runtime directory.
        location = /x86_64-efi/boot.ipxe {
            alias /rpi3b-pxe-runtime/boot.ipxe;
        }

        # Generated by start.sh from the tracked boot-repair overlay source.
        location = /omarchy-repair-apkovl.tar.gz {
            alias /rpi3b-pxe-runtime/omarchy-repair-apkovl.tar.gz;
        }

        # PXE readiness is based on the actual files currently present.
        location = /ready/templeos {
            default_type text/plain;
            add_header Cache-Control "no-store";
            if (!-f /var/www/htdocs/media/templeos/TempleOS.ISO) { return 404; }
            if (!-f /var/www/htdocs/templeos-apkovl.tar.gz) { return 404; }
            return 200 "ready\n";
        }

        location = /ready/omarchy-install {
            default_type text/plain;
            add_header Cache-Control "no-store";
            if (!-f /var/www/htdocs/media/omarchy/arch/boot/x86_64/vmlinuz-linux-t2) { return 404; }
            if (!-f /var/www/htdocs/media/omarchy/arch/boot/x86_64/initramfs-linux-t2.img) { return 404; }
            if (!-f /var/www/htdocs/media/omarchy/arch/x86_64/airootfs.sfs) { return 404; }
            return 200 "ready\n";
        }

        # Compatibility with boot.ipxe generated by older versions.
        location = /ready/omarchy {
            default_type text/plain;
            add_header Cache-Control "no-store";
            if (!-f /var/www/htdocs/media/omarchy/arch/boot/x86_64/vmlinuz-linux-t2) { return 404; }
            if (!-f /var/www/htdocs/media/omarchy/arch/boot/x86_64/initramfs-linux-t2.img) { return 404; }
            if (!-f /var/www/htdocs/media/omarchy/arch/x86_64/airootfs.sfs) { return 404; }
            return 200 "ready\n";
        }

        location = /ready/omarchy-nfs {
            default_type text/plain;
            add_header Cache-Control "no-store";
            if (!-f /var/www/htdocs/media/omarchy-nfs/root/.rpi3b-pxe-nfs-ready) { return 404; }
            if (!-f /var/www/htdocs/media/omarchy-nfs/root/etc/os-release) { return 404; }
            if (!-f /var/www/htdocs/media/omarchy-nfs/root/boot/vmlinuz-rpi3b-pxe) { return 404; }
            if (!-f /var/www/htdocs/media/omarchy-nfs/root/boot/initramfs-rpi3b-pxe.img) { return 404; }
            return 200 "ready\n";
        }

        location = /ready/tinycore {
            default_type text/plain;
            add_header Cache-Control "no-store";
            if (!-f /var/www/htdocs/tinycore/vmlinuz) { return 404; }
            if (!-f /var/www/htdocs/tinycore/corepure64.gz) { return 404; }
            return 200 "ready\n";
        }

        location = /templeos.org/Downloads/TempleOS.ISO {
            alias /var/www/htdocs/media/templeos/TempleOS.ISO;
        }

        # Managed RO media: installer media and promoted NFS roots.
        location /media/ {
            try_files $uri =404;
        }

        location /dl-cdn.alpinelinux.org/ {
            rewrite ^/dl-cdn.alpinelinux.org/(.*)$ /$1 break;
            try_files $uri @mirror;
        }

        location @mirror {
            proxy_pass https://dl-cdn.alpinelinux.org;
            proxy_cache apkcache;
            proxy_cache_valid 200 302 30d;
            proxy_cache_valid 404 1m;
            add_header X-Cache-Status $upstream_cache_status;
        }
    }
}
