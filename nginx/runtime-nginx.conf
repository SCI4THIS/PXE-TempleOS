worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log /dev/stderr;
    error_log /dev/stderr;
    sendfile on;
    keepalive_timeout 65;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=apkcache:10m max_size=1g inactive=30d use_temp_path=off;

    server {
        listen 80;
        root /var/www/htdocs;

        # boot.ipxe is generated by start.sh in a bind-mounted runtime directory.
        # Directory mounting keeps atomic file replacements visible to nginx.
         location = /x86_64-efi/boot.ipxe {
            alias /rpi3b-pxe-runtime/boot.ipxe;
	}

	# PXE clients probe these tiny endpoints before building the menu.
	# Each request checks the files currently present in the served/exported
	# trees, so stale completion markers cannot expose an invalid boot item.
	location = /ready/templeos {
          default_type text/plain;
	  add_header Cache-Control "no-store";
	  if (!-f /var/www/htdocs/media/templeos/TempleOS.ISO) { return 404; }
	  if (!-f /var/www/htdocs/media/templeos-apkovl.tar.gz) { return 404; }
	  return 200 "ready\n";
	}

	location = /ready/omarchy {
          default_type text/plain;
          add_header Cache-Control "no-store";
          if (!-f /var/www/htdocs/media/omarchy/arch/boot/x86_64/vmlinuz-linux-t2) { return 404; }
          if (!-f /var/www/htdocs/media/omarchy/arch/boot/x86_64/initramfs-linux-t2.img) { return 404; }
          if (!-f /var/www/htdocs/media/omarchy/arch/x86_64/airootfs.sfs) { return 404; }
          return 200 "ready\n";
	}

	location = /ready/tinycore {
          default_type text/plain;
          add_header Cache-Control "no-store";
          if (!-f /var/www/htdocs/tinycore/vmlinuz) { return 404; }
          if (!-f /var/www/htdocs/tinycore/corepure64.gz) { return 404; }
          return 200 "ready\n";
        }

        # TempleOS is downloaded and completion-checked by start.sh.
        location = /templeos.org/Downloads/TempleOS.ISO {
            alias /var/www/htdocs/media/templeos/TempleOS.ISO;
        }

        # Managed RO media, including Omarchy kernel/initramfs.
        location /media/ {
            try_files $uri =404;
        }

        location /dl-cdn.alpinelinux.org/ {
            rewrite ^/dl-cdn.alpinelinux.org/(.*)$ /$1 break;
            try_files $uri @mirror;
        }

        location @mirror {
            proxy_pass https://dl-cdn.alpinelinux.org;
            proxy_cache apkcache;
            proxy_cache_valid 200 302 30d;
            proxy_cache_valid 404 1m;
            add_header X-Cache-Status $upstream_cache_status;
        }
    }
}
